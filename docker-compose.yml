services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-notebook-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  app:
    build: .
    container_name: rag-notebook-app
    command: pnpm start
    ports:
      - "3000:3000"
    depends_on:
      - qdrant
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - PROVIDER=${PROVIDER:-google}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}

volumes:
  qdrant_data:
