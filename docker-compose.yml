version: "3.9"
services:
  app:
    build: .
    container_name: rag-notebook-app
    command: pnpm start
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Add any required env vars (DB URL, API keys, etc.)
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant
    container_name: rag-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
